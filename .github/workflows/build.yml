name: Build THE BOWOTTO

# Lessons learned (probed 2026-08-31 via win-diag.yml, results on the
# ci-diag-results branch):
#   - windows-latest is the win25-vs2026 image: Visual Studio 18 2026 only.
#     Never pin a VS generator version — omit -G and let CMake pick the
#     newest VS on the image, so image upgrades can't break us again.
#   - Plain -G Ninja on these runners grabs a stray MinGW gcc from PATH,
#     and JUCE 8 dropped MinGW. Don't use Ninja on Windows CI.
#   - No choco installs needed: cmake + MSVC are preinstalled.
#   - The Windows .vst3 is a folder bundle -> zip it ourselves so the
#     download extracts as "The Bowotto.vst3", not a bare "Contents".
#   - The 23-test bench runs green on the Windows runner (proven in the
#     probe) and exits non-zero on failure, so it gates every build.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # release job uploads assets

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (default generator picks the image's Visual Studio)
        run: cmake -B build -DBOWOTTO_COPY_AFTER_BUILD=OFF -DBOWOTTO_BUILD_SNAPSHOT=OFF

      - name: Build VST3 + test bench
        run: cmake --build build --config Release --target TheBowotto_VST3 BowottoTests --parallel

      - name: Run the 23-test bench on Windows
        run: build/Release/BowottoTests.exe

      - name: Zip the VST3 bundle
        shell: pwsh
        run: Compress-Archive -Path "build/TheBowotto_artefacts/Release/VST3/The Bowotto.vst3" -DestinationPath "The-Bowotto-Windows-VST3.zip"

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: bowotto-windows-vst3
          path: The-Bowotto-Windows-VST3.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBOWOTTO_COPY_AFTER_BUILD=OFF -DBOWOTTO_BUILD_SNAPSHOT=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Run the 23-test bench on macOS
        run: build/BowottoTests

      - name: Zip AU + VST3
        run: |
          mkdir -p bowotto-macos
          cp -R "build/TheBowotto_artefacts/AU/The Bowotto.component" bowotto-macos/ 2>/dev/null || cp -R "build/TheBowotto_artefacts/Release/AU/The Bowotto.component" bowotto-macos/
          cp -R "build/TheBowotto_artefacts/VST3/The Bowotto.vst3" bowotto-macos/ 2>/dev/null || cp -R "build/TheBowotto_artefacts/Release/VST3/The Bowotto.vst3" bowotto-macos/
          zip -r The-Bowotto-macOS.zip bowotto-macos/

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: bowotto-macos
          path: The-Bowotto-macOS.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/bowotto-windows-vst3/The-Bowotto-Windows-VST3.zip
            artifacts/bowotto-macos/The-Bowotto-macOS.zip
          body: |
            THE BOWOTTO — Big Muff grunge amp that morphs into a violin.

            **Windows (Otto):** download `The-Bowotto-Windows-VST3.zip`, extract,
            and copy the `The Bowotto.vst3` folder into
            `C:\Program Files\Common Files\VST3`, then rescan plugins in your DAW.

            **macOS:** download `The-Bowotto-macOS.zip` — contains the AU
            (`.component` -> `~/Library/Audio/Plug-Ins/Components`) and VST3
            (`.vst3` -> `~/Library/Audio/Plug-Ins/VST3`).

            Both builds pass the full 23-test DSP bench on their own platform in CI.
            Changelog: see README.md.
