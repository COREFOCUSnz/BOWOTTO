name: Build THE BOWOTTO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install cmake ninja -y

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: bowotto-vst3-windows
          path: build/TheBowotto_artefacts/Release/VST3/The Bowotto.vst3

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Create AU + VST3 zip
        run: |
          mkdir -p bowotto-macos
          cp -R build/TheBowotto_artefacts/Release/AU/The\ Bowotto.component bowotto-macos/
          cp -R build/TheBowotto_artefacts/Release/VST3/The\ Bowotto.vst3 bowotto-macos/
          zip -r bowotto-macos.zip bowotto-macos/

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: bowotto-macos
          path: bowotto-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/bowotto-vst3-windows/The Bowotto.vst3
            artifacts/bowotto-macos/bowotto-macos.zip
          body: |
            ## Release Notes
            For detailed changes, see the changelog in README.md

            **Windows:** VST3 plugin (.vst3)
            **macOS:** AU + VST3 plugins (.component + .vst3)
