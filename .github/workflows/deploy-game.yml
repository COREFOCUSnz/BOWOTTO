# Deploy the 2Fort game to Firebase Hosting.
#
# Manual on purpose: run it from the Actions tab when you want the live site to
# change. To make every push to the game publish automatically, uncomment the
# `push:` block below — but note that then anything merged goes straight live.
#
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT_2FORT. See game/DEPLOY.md for
# how to create it. It is a service account JSON, NOT the web app's apiKey —
# those are different things and the apiKey is not a secret at all.
name: Deploy game

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "live (the real site) or preview (a temporary URL)"
        required: true
        default: preview
        type: choice
        options: [preview, live]
  # push:
  #   branches: [main]
  #   paths: ["game/**"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is present
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_2FORT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_2FORT is not set. See game/DEPLOY.md."
            exit 1
          fi
          # Fail loudly on the most likely mix-up rather than letting the deploy
          # fail later with something cryptic.
          if ! printf '%s' "$SA" | grep -q '"type"[[:space:]]*:[[:space:]]*"service_account"'; then
            echo "::error::That secret is not a service account JSON. If it starts with AIza it is the WEB API KEY, which is public and is not what deploys."
            exit 1
          fi
          echo "service account looks right"

      # One source of truth for the project id: game/.firebaserc, the same file
      # the firebase CLI reads. Hardcoding it here as well meant a project
      # renamed or recreated under a new id would half-work and fail obscurely.
      - name: Read the project id from .firebaserc
        id: cfg
        run: |
          # read as JSON, not require(): .firebaserc has no .json extension, so
          # node would try to parse it as JavaScript and fail on the first colon
          ID=$(node -p "JSON.parse(require('fs').readFileSync('game/.firebaserc','utf8')).projects.default")
          if [ -z "$ID" ] || [ "$ID" = "undefined" ]; then
            echo "::error::no default project in game/.firebaserc"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "deploying to $ID"

      # Best-effort, mirrors game/publish.sh's own "online play" step (web app
      # config, database rules) but authenticates non-interactively with the
      # same service account used for the hosting deploy below, via
      # GOOGLE_APPLICATION_CREDENTIALS, instead of an interactive
      # `firebase login`. Never allowed to fail the job: online play simply
      # stays off (js/net.js fails closed) if this doesn't finish, and the
      # actual hosting deploy below -- the part that's proven to work --
      # always runs regardless. See game/DEPLOY.md.
      - name: Set up online play (optional)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_2FORT }}
          PROJECT_ID: ${{ steps.cfg.outputs.id }}
        run: |
          set +e
          FB="npx -y firebase-tools@13"
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd game

          APPID=$($FB apps:list WEB --project "$PROJECT_ID" 2>/dev/null | sed -n 's/.*│ *\(1:[A-Za-z0-9:_-]\{15,\}\) *│.*/\1/p' | head -1)
          if [ -z "$APPID" ]; then
            echo "No web app on this project yet -- creating one."
            $FB apps:create WEB "2Fort Web" --project "$PROJECT_ID" >/dev/null 2>&1
            APPID=$($FB apps:list WEB --project "$PROJECT_ID" 2>/dev/null | sed -n 's/.*│ *\(1:[A-Za-z0-9:_-]\{15,\}\) *│.*/\1/p' | head -1)
          fi

          DB_URL=""
          if [ -n "$APPID" ]; then
            CONFIG_JS=$($FB apps:sdkconfig WEB "$APPID" --project "$PROJECT_ID" 2>/dev/null)
            DB_URL=$(node -e "
              const m = \`$CONFIG_JS\`.match(/\{[\s\S]*\}/);
              if (!m) process.exit(0);
              try { const cfg = new Function('return (' + m[0] + ')')(); if (cfg.databaseURL) { console.log(JSON.stringify(cfg)); } } catch (e) {}
            " 2>/dev/null)
          fi

          if [ -n "$DB_URL" ]; then
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(process.argv[1]);
              fs.writeFileSync('firebase-config.js',
                '// Web app config for online play (js/net.js), auto-generated by the\n' +
                '// deploy-game workflow. Not a secret -- see DEPLOY.md.\n' +
                'window.__FIREBASE_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n');
            " "$DB_URL"
            echo "Wrote firebase-config.js"
            if $FB deploy --only database --project "$PROJECT_ID" 2>&1; then
              echo "Realtime Database rules deployed."
            else
              echo "::warning::Could not deploy database.rules.json -- has Realtime Database been enabled for $PROJECT_ID yet? See game/DEPLOY.md."
            fi
          else
            echo "::warning::Skipping online play setup (could not read this project's web app config). Hosting will still deploy normally. See game/DEPLOY.md."
          fi
          rm -f "$RUNNER_TEMP/sa.json"
          exit 0

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_2FORT }}
          projectId: ${{ steps.cfg.outputs.id }}
          entryPoint: ./game
          channelId: ${{ inputs.channel == 'live' && 'live' || format('preview-{0}', github.run_number) }}
