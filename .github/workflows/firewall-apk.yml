name: Build Firewall APK

# Nothing to do with THE BOWOTTO. This builds the Android app under
# apps/firewall/, which shares the repository and nothing else - hence the
# path filter, so plugin commits never spin up an Android toolchain.
#
# Notes:
#   - ubuntu-latest ships the Android SDK and accepted licences already, so
#     there is no sdkmanager dance and no licence-acceptance step.
#   - There is no Gradle wrapper checked in (generating one needs network
#     access the authoring environment did not have), so setup-gradle installs
#     a pinned Gradle instead of ./gradlew. If a wrapper is ever added, drop
#     gradle-version and switch the run steps to ./gradlew.
#   - assembleDebug signs with the standard debug keystore, which is what
#     makes the output installable by sideloading. It is NOT a release build:
#     debuggable, and anyone can rebuild it with the same key.

on:
  push:
    branches: ['**']
    paths:
      - 'apps/firewall/**'
      - '.github/workflows/firewall-apk.yml'
  pull_request:
    paths:
      - 'apps/firewall/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/firewall

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The tests gate the build: 28 of them, none needing a device, and they
      # cover the container format, the key hierarchy and the screen policy.
      # A red suite must not produce an APK anyone installs.
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      # Also an assertion, not just a printout. docs/SECURITY.md makes a claim
      # about what this app can reach, and it is worth checking against the
      # built APK rather than by reading our own AndroidManifest.xml, because
      # manifest merging pulls in whatever the dependencies declare.
      #
      # It found something the first time it ran: androidx.core merges in
      # <app id>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION, which is plumbing
      # for ContextCompat.registerReceiver. It is signature-protected and
      # namespaced to this app, so it grants no access to the phone - but it
      # does mean "requests no permissions" was the wrong claim to assert.
      # What matters is that nothing outside our own namespace appears, so
      # that is what this checks.
      - name: Inspect the APK and check what it can reach
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"

          # Exact keys only: application-label has a line per locale and would
          # otherwise bury everything else under 70 lines of 'Blockfall'.
          "$aapt2" dump badging "$apk" | grep -E \
            "^(package:|application-label:|sdkVersion:|targetSdkVersion:|launchable-activity:)"

          echo "size:   $(du -h "$apk" | cut -f1)"
          echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)"

          echo "--- permissions, as declared and requested in the merged manifest"
          "$aapt2" dump permissions "$apk"
          echo "---"

          # The headline claim, named explicitly rather than inferred from a
          # count: no network access, so nothing in the vault can be sent
          # anywhere even if the rest of the app were wrong.
          if "$aapt2" dump badging "$apk" | grep -q "android.permission.INTERNET"; then
            echo "::error::APK requests INTERNET. The vault must have no network access."
            exit 1
          fi
          echo "ok: no INTERNET permission"

          # Anything outside our own package namespace is a real capability
          # over the phone and must be deliberate. Nothing qualifies today.
          foreign=$(
            "$aapt2" dump badging "$apk" \
              | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
              | grep -v "^nz\.corefocus\.firewall\." || true
          )
          if [ -n "$foreign" ]; then
            echo "::error::APK requests permissions outside its own namespace:"
            echo "$foreign"
            exit 1
          fi
          echo "ok: no permissions outside nz.corefocus.firewall.*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firewall-debug-apk
          path: apps/firewall/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firewall-test-report
          path: apps/firewall/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
